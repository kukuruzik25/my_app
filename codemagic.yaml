scripts:
  - name: Build Widget Extension
    script: |
      cd ios
      xcodebuild -project Runner.xcodeproj \
                 -scheme WidgetExtension \
                 -configuration Release \
                 -sdk iphoneos \
                 CODE_SIGNING_ALLOWED=NO \
                 build
      cd ..

  - name: Build iOS App
    script: |
      flutter build ipa --release \
        --export-options-plist=$HOME/export_options.plist